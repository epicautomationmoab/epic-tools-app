name: Fix courtesy call spacing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Temporarily add courtesy call spacing fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Adjust courtesy call spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/team/readiness/ReadinessTable.tsx')
          text = path.read_text()
          old = '''                <span>\n                  <strong>Courtesy Call</strong>\n                  <span className={styles.subLine}>\n                    {courtesyCompletion\n                      ? `Completed · ${courtesyCompletion.completedBy}`\n                      : "Not completed"}\n                  </span>\n                </span>'''
          new = '''                <span\n                  style={{\n                    display: "inline-flex",\n                    alignItems: "baseline",\n                    gap: 8,\n                  }}\n                >\n                  <strong>Courtesy Call</strong>\n                  <span className={styles.subLine} style={{ marginTop: 0 }}>\n                    {courtesyCompletion\n                      ? `Completed · ${courtesyCompletion.completedBy}`\n                      : "Not completed"}\n                  </span>\n                </span>'''
          if old not in text:
              raise SystemExit('Target courtesy call block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "epicautomationmoab"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-courtesy-call-spacing.yml
          git add app/team/readiness/ReadinessTable.tsx .github/workflows/fix-courtesy-call-spacing.yml
          git commit -m "Fix courtesy call status spacing"
          git push origin HEAD:main
