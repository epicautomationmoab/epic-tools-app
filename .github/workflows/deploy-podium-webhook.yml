name: Deploy Podium 2700 SMS webhook
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy signed Podium webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Configure repository secret SUPABASE_ACCESS_TOKEN first."
            exit 1
          fi
          supabase functions deploy podium-sms-webhook --project-ref kbuxcvqzicnydqllyong --no-verify-jwt
