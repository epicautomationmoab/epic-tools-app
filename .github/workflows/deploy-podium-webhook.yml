name: Deploy Podium 2700 SMS receiver
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Podium feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/c360-podium-sms-2700
          persist-credentials: false
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy only the Podium receiver
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret"
            exit 1
          fi
          supabase functions deploy podium-sms-webhook --project-ref kbuxcvqzicnydqllyong --no-verify-jwt
